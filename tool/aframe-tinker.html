
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mediscan+ App Demo</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>

<body>
  <a-scene background="color: #dfefff">


    <a-light type="ambient" intensity="1"></a-light>
    <a-light type="directional" position="0 5 5" intensity="1"></a-light>


    <a-entity position="0 1.6 4">
      <a-camera></a-camera>
    </a-entity>


    <a-plane
      rotation="-90 0 0"
      width="20"
      height="20"
      color="#f5f5f5">
    </a-plane>


    <a-box
      position="0 1.8 -3"
      width="1.5"
      height="3"
      depth="0.08"
      color="#111111"
      radius="0.15">
    </a-box>


    <a-plane
      position="0 1.8 -2.95"
      width="1.3"
      height="2.7"
      color="#ffffff">
    </a-plane>


    <a-plane
      position="0 2.8 -2.94"
      width="1.3"
      height="0.35"
      color="#4DA6FF">
    </a-plane>

    <a-text
      value="Mediscan+"
      position="-0.42 2.78 -2.93"
      color="#ffffff"
      width="2.5">
    </a-text>


    <a-circle
      position="0 1.45 -2.93"
      radius="0.28"
      color="#4DA6FF"
      animation="property: scale; dir: alternate; dur: 1200; loop: true; to: 1.08 1.08 1.08">
    </a-circle>

    <a-text
      value="SCAN"
      position="-0.13 1.42 -2.92"
      color="#ffffff"
      width="1.2">
    </a-text>


    <a-plane
      position="0 2.2 -2.94"
      width="1"
      height="0.25"
      color="#eef5ff">
    </a-plane>

    <a-text
      value="Heart Rate"
      position="-0.33 2.18 -2.93"
      color="#333333"
      width="1.5">
    </a-text>

    <a-plane
      position="0 1.9 -2.94"
      width="1"
      height="0.25"
      color="#eef5ff">
    </a-plane>

    <a-text
      value="Body Scan"
      position="-0.32 1.88 -2.93"
      color="#333333"
      width="1.5">
    </a-text>

    <a-plane
      position="0 1.6 -2.94"
      width="1"
      height="0.25"
      color="#eef5ff">
    </a-plane>

    <a-text
      value="AI Reports"
      position="-0.31 1.58 -2.93"
      color="#333333"
      width="1.5">
    </a-text>


    <a-box
      position="0.95 2.35 -3"
      width="0.18"
      height="0.45"
      depth="0.12"
      color="#d9d9d9">
    </a-box>


    <a-cylinder
      position="1.05 2.52 -2.98"
      radius="0.05"
      height="0.08"
      rotation="90 0 0"
      color="#222222">
    </a-cylinder>


    <a-cylinder
      position="1.05 2.52 -2.5"
      radius="0.015"
      height="0.9"
      rotation="90 0 0"
      color="#ff4d4d"
      opacity="0.5"
      animation="property: opacity; dir: alternate; dur: 700; loop: true; to: 0.1">
    </a-cylinder>



    <a-plane
      position="-2 2 -5"
      width="2"
      height="1"
      color="#ffffff">
    </a-plane>

    <a-text
      value="Simple Medical
Tracking App"
      position="-2.7 2.1 -4.9"
      color="#333333"
      width="3">
    </a-text>

    <a-plane
      position="2 2 -5"
      width="2"
      height="1"
      color="#ffffff">
    </a-plane>

    <a-text
      value="Fast Health
Scanning"
      position="1.4 2.1 -4.9"
      color="#333333"
      width="3">
    </a-text>

  </a-scene>
</body>
</html>
